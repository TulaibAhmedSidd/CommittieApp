<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Emerald Shield Gradient -->
    <linearGradient id="shieldGrad" x1="128" y1="64" x2="384" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Gold Ring Gradient -->
    <linearGradient id="goldGrad" x1="64" y1="128" x2="448" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Golden Savings Loop Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#goldGrad)" stroke-width="28" stroke-dasharray="1100" stroke-dashoffset="50" fill="none" opacity="0.95" />
  
  <!-- Intersecting Golden Orbit Ring -->
  <ellipse cx="256" cy="256" rx="230" ry="110" stroke="url(#goldGrad)" stroke-width="20" fill="none" transform="rotate(-30 256 256)" opacity="0.85"/>

  <!-- Central Emerald Security Shield -->
  <path d="M256 72 L368 128 V248 C368 340 318 412 256 448 C194 412 144 340 144 248 V128 L256 72 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#emeraldGlow)"
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Inner Shield Accent Line -->
  <path d="M256 104 L340 148 V240 C340 314 298 374 256 406 C214 374 172 314 172 240 V148 L256 104 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="8" 
        opacity="0.3"/>

  <!-- White Trust Checkmark -->
  <path d="M216 256 L244 284 L296 220" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
